# Cloudflare Workers (Static Assets) — despliegue de la SPA React
# URL REAL que usan los usuarios: sergiocarrillo2026.bemo.workers.dev
#   - name = "sergiocarrillo2026"  -> primera parte de la URL
#   - subdominio de cuenta "bemo" -> se cambia en el dashboard (afecta toda la cuenta)
# OJO: antes esto decía "control" y los deploys iban a control.bemo.workers.dev,
#      una URL que NADIE usaba. Ahora apunta al worker correcto.
name = "sergiocarrillo2026"
compatibility_date = "2026-07-10"
workers_dev = true

# Sirve la carpeta build/ (salida de `npm run build`) como assets estáticos.
# not_found_handling = single-page-application  ->  todas las rutas caen a index.html
[assets]
directory = "./build"
not_found_handling = "single-page-application"

# --- Cómo desplegar ---
# Manual desde tu PC:   npm run build ; npx wrangler deploy   (va a sergiocarrillo2026)
# Git (auto): Workers Builds conectado al Worker "sergiocarrillo2026" en el dashboard.
