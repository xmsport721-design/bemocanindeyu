# Cloudflare Workers (Static Assets) — despliegue de la SPA React
# URL objetivo: control.bemo2026.workers.dev
#   - name = "control"  -> primera parte de la URL
#   - subdominio de cuenta "bemo2026" -> se cambia en el dashboard (afecta toda la cuenta)
name = "sergiocarrillo2026"
compatibility_date = "2026-07-10"
workers_dev = true

# Sirve la carpeta build/ (salida de `npm run build`) como assets estáticos.
# not_found_handling = single-page-application  ->  todas las rutas caen a index.html
[assets]
directory = "./build"
not_found_handling = "single-page-application"

# --- Cómo desplegar ---
# Manual desde tu PC:   npm run build ; npx wrangler deploy
# Git (auto): conectar Workers Builds al Worker "control" en el dashboard.
